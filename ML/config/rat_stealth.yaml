# Farenin gizli yaklasma davranisi icin PPO egitimi.
# Calistirma: ML/train.sh
behaviors:
  RatStealth:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 10000

env_settings:
  num_envs: 4
  seed: 42

engine_settings:
  time_scale: 20
  no_graphics: true
